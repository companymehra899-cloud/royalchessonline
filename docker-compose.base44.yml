# Base44 development environment for Royal Chess Online.
# Single-origin wiring: only port 3000 (Expo web) is public. Metro proxies
# /api/* requests to the FastAPI backend over the compose network.
#
# App source is bind-mounted into every app service and run with live-reload
# dev commands, so edits appear in the preview without image rebuilds.
# Databases/infra are plain prebuilt images.

services:
  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: python:3.13-slim
    working_dir: /app/backend
    environment:
      # Local infra credentials + app-internal dev JWT secret (generated, not user-supplied).
      MONGO_URL: mongodb://db:27017
      DB_NAME: chess_arena
      JWT_SECRET: U3TjNQ3x7V-Db7NW1C-PO72FCTDkUBxs_7Rycq10Y6EjkJhwmUNbTqQ-3gzlF0ig
      ADMIN_EMAILS: ""
      LEAGUE_CLAIM_URL: ""
      PYTHONUNBUFFERED: "1"
    env_file:
      - /run/base44/app.env
    volumes:
      - ./:/app
      - pip-cache:/root/.cache/pip
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && exec uvicorn server:app --reload --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app/frontend
    environment:
      # Metro proxies /api/* to the backend over the compose network.
      EXPO_PUBLIC_BACKEND_TARGET: http://backend:8000
      # Empty => frontend uses same-origin relative /api paths (proxied by Metro).
      EXPO_PUBLIC_BACKEND_URL: ""
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
      - frontend-expo-cache:/app/frontend/.expo
      - frontend-metro-cache:/app/frontend/.metro-cache
    ports:
      - "3000:3000"
    command: >
      sh -c "if [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm install; fi
      && exec npx expo start --web --port 3000"
    depends_on:
      - backend

volumes:
  mongo-data:
  pip-cache:
  frontend-node-modules:
  frontend-expo-cache:
  frontend-metro-cache:
