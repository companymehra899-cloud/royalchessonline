services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: chess
      MONGO_INITDB_ROOT_PASSWORD: chesspass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://chess:chesspass@mongo:27017/?authSource=admin
      DB_NAME: chess_arena
      JWT_SECRET: base44_dev_jwt_secret_change_me
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.base44.txt &&
             uvicorn server:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: node:22
    working_dir: /app/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      EXPO_PUBLIC_BACKEND_TARGET: http://backend:8000
      EXPO_PUBLIC_BACKEND_URL: ""
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install --ignore-scripts &&
             npx expo start --web --port 3000 --host lan"

volumes:
  mongo_data:
